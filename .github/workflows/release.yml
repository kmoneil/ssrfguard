# Publish a release to PyPI, triggered by pushing a tag.
#
# **There is no API token here and there must not be one.** This uses PyPI's trusted publishing
# (OpenID Connect): GitHub mints a short-lived token for this repository, this workflow and this
# environment, and PyPI verifies it. A long-lived `PYPI_API_TOKEN` in repository secrets is a
# credential that can be exfiltrated by any workflow that runs untrusted code. The
# `id-token: write` permission below is what mints it, and it is granted to the publish job
# alone rather than to the workflow.
#
# One-time setup on PyPI, which cannot be done from here:
#   https://pypi.org/manage/account/publishing/ -> add a pending publisher
#     PyPI project name : ssrfguard
#     Owner             : kmoneil
#     Repository        : ssrfguard
#     Workflow          : release.yml
#     Environment       : pypi
#
# **The `pypi` environment must carry two protection rules, and neither is in this repository.**
# They are configured in repository settings, so `git` does not track them, a review cannot see
# them and no test can read them. Recorded here because a guard nobody can find is one a future
# change removes without noticing:
#
#   deployment branch policy : one pattern, `v*`, of type **tag**. This is what refuses a
#                              `workflow_dispatch` against a branch, at the environment gate,
#                              before the publish step runs
#   required reviewers       : kmoneil, the human gate between the tag and the upload
#
# Read them back with:
#   gh api repos/kmoneil/ssrfguard/environments/pypi
#   gh api repos/kmoneil/ssrfguard/environments/pypi/deployment-branch-policies
#
# The `publish` job restates the tag half as an `if:`. That restatement is not what enforces it,
# because the environment is. But the rule lives in settings where nothing can review it, and
# written out it is in the file the reader is holding.
#
# **Reserve the distribution name before the first real release.** `ssrfguard` was unclaimed on
# PyPI as of 2026-08-22 and a name is not reserved by intending to use it.

name: release

on:
  push:
    tags: ["v*"]
  # Deliberately available by hand too: a tag that failed to publish for an infrastructure
  # reason should not need a second tag to retry, since a version can only be uploaded once.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate first. Publishing is the one irreversible step in this project: a
  # version number on PyPI cannot be reused, even after a delete. So the full
  # gating set runs against the tagged tree before anything is built for upload.
  #
  # **Every `uv` invocation here takes `--frozen`**, so the one lane that ends in
  # an upload is not the only one permitted to install something `uv.lock` does
  # not name. The hashes in the lock are worth exactly what the flag that
  # insists on them is worth.
  #
  # `zero-deps` runs here and it is the lane that matters most at this moment.
  # It is the only one that reads the artifact a user would actually download,
  # and the promise it checks, that installing this package installs nothing
  # else, is the promise a published version cannot take back.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen python scripts/lanes.py gates
      - run: uv run --frozen python scripts/lanes.py fast
      - run: uv run --frozen python scripts/lanes.py rebind
      - run: uv run --frozen python scripts/lanes.py adapters
      - run: uv run --frozen python scripts/lanes.py egress
      # Its own environment, for the reason `ci.yml` gives: pip-audit pulls `requests` and
      # `urllib3`, and installing them next to the zero-deps check would make its precondition
      # silently false. Run last so nothing after it inherits the contamination.
      - run: uv run --no-project --python 3.13 python scripts/lanes.py zero-deps
      - run: uv sync --frozen --group audit
      - run: uv run --frozen python scripts/lanes.py audit

  # ---------------------------------------------------------------------------
  # Build once, publish that artifact. Building separately in the publish job
  # would upload something no check has seen.
  #
  # `--no-build-isolation` over a synced `build` group, rather than the default.
  # The default is what it looks like: PEP 517 resolves `[build-system] requires`
  # fresh from PyPI into a throwaway environment, so the backend that *produces*
  # the artifact would be the last thing in this path arriving unpinned and
  # unhashed. With the group synced it comes from `uv.lock` like everything
  # else, which for a package whose whole argument is about what a user ends up
  # installing is not a detail we get to wave through.
  # ---------------------------------------------------------------------------
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv python install
      - run: uv sync --frozen --group build

      # **Both refusals below are tag-guarded, and that is only safe because `publish` is too.**
      # They read `GITHUB_REF_NAME` as a version, which on a branch dispatch is a branch name.
      # With the guard on `publish` matching theirs the invariant is closed and worth stating:
      # the only ref that reaches `publish` is a `v*` tag, and on that ref both of these are
      # armed.
      - name: Refuse a tag that disagrees with the packaged version
        # The version is single-sourced from `src/ssrfguard/__init__.py`, so a `v0.2.0` tag on a
        # tree that still says `0.1.0` would publish 0.1.0 a second time and fail at the upload
        # after everything had passed, which reads as an infrastructure problem. Caught here
        # instead, where the message names the actual mistake.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          packaged="$(uv run --frozen python -c 'import ssrfguard; print(ssrfguard.__version__)')"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$packaged" != "$tagged" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match __version__ ${packaged}" >&2
            exit 1
          fi

      - name: Refuse a tag whose changelog section is still 'Unreleased'
        # `tests/test_packaging.py` accepts either a `## <version>` heading or `## Unreleased`,
        # because before the first tag the honest answer is the second one. Tagging is the
        # moment that stops being true, and it is the only moment: nothing a commit-time hook
        # can see distinguishes "not released yet" from "forgot to write it up".
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## ${version}( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## ${version}' section; rename '## Unreleased' and date it" >&2
            exit 1
          fi

      - run: uv build --no-build-isolation

      # **The SBOM is nearly empty and that is the entire point.** For most
      # packages an SBOM is a compliance artifact; for this one it is the product claim in a
      # machine-readable form, and it is the thing a procurement reviewer can diff against
      # every other candidate in the category. Generated from the built wheel rather than from
      # `pyproject.toml`, so it describes the artifact rather than the intention.
      #
      # This does **not** replace the PEP 740 attestation `publish` produces, and the two
      # answer different questions: the attestation says who built this, the SBOM says what is
      # inside it. Shipping only one would leave the other unanswered.
      - name: Generate the (nearly empty) SBOM
        run: |
          set -euo pipefail
          uv tool run --from cyclonedx-bom cyclonedx-py environment \
            --output-format json --outfile dist/ssrfguard.cdx.json \
            "$(uv run --frozen python -c 'import sys; print(sys.executable)')" || {
              echo "SBOM generation failed" >&2; exit 1;
            }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution
          path: dist/

  # ---------------------------------------------------------------------------
  # The only job that can publish, and the only one holding `id-token: write`.
  # ---------------------------------------------------------------------------
  publish:
    needs: build
    # Restates the `pypi` environment's tag policy, and is not what enforces it. See the header.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # mints the OIDC token trusted publishing verifies; nothing else needs it
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: dist/
          # Restates this action's own default, for the reason `attestations: true` below is
          # written out: a default a decision rests on is one an edit can turn off with nothing
          # reading as changed. `error` is the difference between a corrupted artifact failing
          # the run and it being *logged* and then uploaded.
          digest-mismatch: error
      # The SBOM is not a distribution file and `twine check` will reject the upload if it is
      # left in `dist/`. It travels on the GitHub release instead, which `announce` attaches.
      - run: rm -f dist/ssrfguard.cdx.json
      # `attestations: true` restates this action's own default, and here it is a line a
      # documented decision rests on: SECURITY.md tells a reader that provenance for this
      # artifact is a signed PEP 740 attestation. That is only true while one is produced.
      # Written out, `tests/test_lanes.py` can pin it, so removing it fails a test that names
      # the page it breaks.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  # ---------------------------------------------------------------------------
  # The GitHub release, after the upload rather than before it. A release object
  # pointing at a version that failed to publish is worse than none: it is the
  # page people link to, and it would claim something exists on PyPI that does
  # not.
  #
  # The notes come out of `CHANGELOG.md` rather than being written again. The
  # changelog already has to carry a section for this version, because `build`
  # refuses the tag otherwise, so a second hand-maintained copy would be a
  # second place to forget.
  #
  # `contents: write` is granted here and nowhere else in this file.
  # ---------------------------------------------------------------------------
  announce:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: dist/
          digest-mismatch: error
      - name: Create the release from this version's changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # From the heading for this version to the next `## ` heading, exclusive. The same
          # section `build` has already checked exists, so this cannot come back empty.
          awk -v want="## ${version}" '
            index($0, want) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no changelog section for ${version}; refusing to publish empty notes" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
