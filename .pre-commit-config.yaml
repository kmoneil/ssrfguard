# Python tools are LOCAL hooks calling .venv/bin/*, so their versions track uv.lock rather than
# a mirror repo that drifts from it. `pre-commit autoupdate` bumps the upstream repos below;
# the local ones move when `uv lock` moves.
#
# Install once:  .venv/bin/pre-commit install
# Never commit with --no-verify.
#
# **`commit-msg` joined the list, so an existing checkout needs `pre-commit install` again.**
# pre-commit writes one file per hook type into `.git/hooks/`, and a checkout installed before
# that entry existed has no `commit-msg` file at all: the hook below is configured, reads as
# configured, and never runs. Nothing warns you. `ls .git/hooks/` is the check.

default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: .venv/bin/ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff (format)
        entry: .venv/bin/ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # mypy and ty are both scoped to `src` by pyproject, and both are configured to check
      # against the **floor's semantics**, `python_version = "3.10"`, while running on the
      # development interpreter. That the floor is 3.10 is load-bearing here rather than
      # incidental: mypy *refuses* `python_version = "3.9"` and warns rather than failing, so at
      # the floor this project originally drafted, this hook would have checked nothing about
      # the floor while appearing to. pyproject argues that at length; do not restate the number
      # here, read it there.
      #
      # Passing filenames would drag in tests/, which is deliberately exempt, so both run
      # project-wide and ignore the staged file list.
      - id: mypy
        name: mypy --strict (src)
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: ty
        name: ty (src)
        entry: .venv/bin/ty check
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: complexipy
        name: complexipy (cognitive complexity <= 15)
        entry: .venv/bin/complexipy
        language: system
        types: [python]
        pass_filenames: false

      # The three type checkers vendor different typeshed snapshots and only pyright's
      # currently carries some of the stdlib deprecations. Kept as a third gate for that
      # reason; see `pyrightconfig.deprecations.json`, which checks at the *newest* supported
      # interpreter rather than at the floor. A typeshed pinned to the floor cannot see an API
      # deprecated after it, which is the whole reason this gate has a configuration of its own.
      - id: deprecations
        name: no deprecated APIs (basedpyright, reportDeprecated)
        entry: .venv/bin/basedpyright -p pyrightconfig.deprecations.json
        language: system
        types: [python]
        pass_filenames: false

      # `UV_CACHE_DIR` is relative so it resolves against the repository root, and pre-commit
      # runs hooks from there. An absolute path here would be an environment-specific fact baked
      # into a committed file, which fails on the first runner that does not have it.
      - id: uv-lock
        name: uv lock is in sync with pyproject
        entry: env UV_CACHE_DIR=.uv-cache uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      # Invoked via `bash` rather than executed, so the hook that forbids the exec bit does not
      # need the exec bit itself and does not have to allowlist its own script.
      - id: forbid-exec-bit
        name: no executable bit in the git index
        entry: bash scripts/forbid_exec_bit.sh
        language: system
        pass_filenames: false

      # Runs on every file type rather than on Python: a credential lands in a YAML, a TOML or
      # a Markdown snippet at least as easily as in a module.
      #
      # The baseline holds one entry and it was read before it was written:
      # `http://user:pass@example.com/` in `tests/test_policy_urls.py`, which is a fixture
      # proving the policy refuses credentials in a URL authority. A test of that has to
      # contain the thing it searches for. No real credential is in it.
      #
      # The baseline is keyed by (file, hashed secret, line) rather than being a file-level
      # exclusion, which is what makes it safe to have: a genuine secret added to an
      # already-listed file still fails.
      #
      # **Creating and updating it are two different commands, and mixing them up costs you a
      # filter.** Creation is the redirect form, once:
      #     .venv/bin/detect-secrets scan > .secrets.baseline
      # Every update after that is the `--baseline` form:
      #     .venv/bin/detect-secrets scan --baseline .secrets.baseline
      # The redirect form on an *existing* baseline rebuilds it from scratch and drops the
      # `filters_used` block it had accumulated, including
      # `detect_secrets.filters.common.is_baseline_file`, which is what stops the baseline
      # being scanned as evidence of itself. `--baseline` on a file that does not exist yet is
      # rejected outright, which is why creation cannot use it. Read the diff rather than
      # trusting it either way.
      - id: detect-secrets
        name: no new secrets (detect-secrets)
        entry: .venv/bin/detect-secrets-hook --baseline .secrets.baseline
        language: system

      # commit-msg only, and it is the reason that stage is installed at all.
      #
      # **A hook on the message file is the only local gate that cannot be routed around by how
      # the message was supplied.** A check on the `git commit` command line sees `-m`, and
      # nothing else: not `-F file`, not an editor session, not `--amend` reusing what was
      # already there. This one runs on the assembled message, after every one of those paths
      # has produced it and before the commit object exists.
      #
      # `--history` is deliberately absent. The lane scans the whole history; this scans the one
      # message being written. Scanning history here would fail a commit for something an
      # ancestor did, at the moment somebody is least able to act on it.
      - id: no-attribution
        name: no tool attribution in the commit message
        entry: .venv/bin/python scripts/check_attribution.py
        language: system
        stages: [commit-msg]

      # pre-push only: too slow for every commit, and the point of the gate is that nothing
      # broken leaves the machine.
      #
      # **Invoked through the lane runner rather than spelling out a pytest command**, which is
      # the same rule `ci.yml` follows and for the same reason: two spellings of "run the tests"
      # drift, and this one had already drifted: it ran without the coverage floor that the
      # `fast` lane gates on, so a change could pass pre-push and fail CI.
      - id: pytest
        name: fast lane (unit, no egress, coverage floor)
        entry: .venv/bin/python scripts/lanes.py fast
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
